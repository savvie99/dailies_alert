name: Daily Slack Reminder

on:
  schedule:
    - cron: '0 8 * * 1-5'  # Monday-Friday at 8 AM UTC
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Send message to Alex
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\": \"Good morning Alex! 👋\",
            \"blocks\": [
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Good morning Alex!* 👋\\n\\nDon't forget to share your daily updates in <#daily-weekly-updates>\"
                }
              },
              {
                \"type\": \"image\",
                \"image_url\": \"https://raw.githubusercontent.com/savvie99/dailies_alert/main/daily.png\",
                \"alt_text\": \"Morning reminder\"
              }
            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK_ALEX }}
      
